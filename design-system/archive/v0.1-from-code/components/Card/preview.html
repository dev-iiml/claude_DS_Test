<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"></head><body>
<div class="cc-pad">
<section class="cc-card" style="max-width:520px">
  <div class="cc-card__header">
    <h2 class="cc-card__title">Profile completion</h2>
    <p class="cc-card__desc">A fuller profile helps us match you with the right programmes.</p>
  </div>
  <div class="cc-card__content" style="display:flex;align-items:flex-end;gap:24px">
    <dl class="cc-metric"><dt>Complete</dt><dd class="cc-metric__value">82%</dd></dl>
    <div class="cc-meter" role="progressbar" aria-label="Profile completion" aria-valuenow="82" aria-valuemin="0" aria-valuemax="100" style="flex:1;margin-bottom:8px"><div style="width:82%"></div></div>
  </div>
  <div class="cc-card__footer"><button class="cc-btn cc-btn--secondary cc-btn--sm">Finish profile</button></div>
</section>
</div>
</body></html>
