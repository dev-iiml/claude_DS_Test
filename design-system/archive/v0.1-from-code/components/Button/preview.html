<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"></head><body>
<div class="cc-pad">
<div class="cc-stack">
  <div class="cc-row">
    <button class="cc-btn cc-btn--primary cc-btn--lg">Apply for membership</button>
    <button class="cc-btn cc-btn--secondary cc-btn--lg">Sign in</button>
  </div>
  <div class="cc-row">
    <button class="cc-btn cc-btn--primary">Continue</button>
    <button class="cc-btn cc-btn--secondary">Save and exit</button>
    <button class="cc-btn cc-btn--ghost cc-btn--sm">Sign out</button>
    <button class="cc-btn cc-btn--link">Back</button>
  </div>
  <div class="cc-row">
    <button class="cc-btn cc-btn--primary" aria-disabled="true"><span class="cc-spinner" aria-hidden="true"></span>Saving…</button>
    <button class="cc-btn cc-btn--destructive">Withdraw consent</button>
    <button class="cc-btn cc-btn--secondary" disabled>Disabled</button>
  </div>
</div>
</div>
</body></html>
