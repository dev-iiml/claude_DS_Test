<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"></head><body>
<div class="cc-pad">
<div class="cc-stack" style="max-width:380px;gap:28px">
  <div class="cc-field">
    <label class="cc-label" for="dn">Display name</label>
        <input class="cc-input" id="dn" value="Aarohi Menon">
  </div>
  <div class="cc-field">
    <label class="cc-label" for="ct">City<span class="cc-optional">(optional)</span></label>
    <input class="cc-input" id="ct" placeholder="Start typing your city">
  </div>
  <div class="cc-field">
    <label class="cc-label" for="gs">GSTIN</label>
    <input class="cc-input" id="gs" aria-invalid="true" aria-describedby="gs-e">
    <p class="cc-error" id="gs-e">Enter a valid 15-character GSTIN.</p>
  </div>
</div>
</div>
</body></html>
