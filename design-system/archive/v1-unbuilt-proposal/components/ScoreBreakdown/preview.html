<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<style>.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)} .lg i{width:10px;height:10px;border-radius:2px}</style>
<div class="spec" style="max-width:720px"><section class="card card-pad stack g2"><div class="row between"><h3 class="t-h3">Component scores</h3><div class="row g3"><span class="lg"><i style="background:var(--chart-1)"></i>Traditional</span><span class="lg"><i style="background:var(--chart-2)"></i>Creator-enhanced</span></div></div>
<div class="factor" style="grid-template-columns:1.4fr 1fr 32px 1fr 32px;border-top:0"><span class="t-eyebrow">Component</span><span class="t-eyebrow" style="grid-column:span 2">Traditional</span><span class="t-eyebrow" style="grid-column:span 2">Creator-enhanced</span></div><div class="factor" style="grid-template-columns:1.4fr 1fr 32px 1fr 32px"><span>Earnings consistency</span><span class="bar" style="opacity:1"><i style="width:61%;background:var(--chart-1)"></i></span><span class="v">61</span><span class="bar"><i style="width:84%"></i></span><span class="v">84</span></div><div class="factor" style="grid-template-columns:1.4fr 1fr 32px 1fr 32px"><span>Financial Capacity</span><span class="bar" style="opacity:1"><i style="width:52%;background:var(--chart-1)"></i></span><span class="v">52</span><span class="bar"><i style="width:78%"></i></span><span class="v">78</span></div><div class="factor" style="grid-template-columns:1.4fr 1fr 32px 1fr 32px"><span>Platform diversification</span><span class="bar"></span><span class="v subtle">n/a</span><span class="bar"><i style="width:70%"></i></span><span class="v">70</span></div><div class="factor" style="grid-template-columns:1.4fr 1fr 32px 1fr 32px"><span>Brand-deal history</span><span class="bar"></span><span class="v subtle">n/a</span><span class="bar"><i style="width:88%"></i></span><span class="v">88</span></div><div class="factor" style="grid-template-columns:1.4fr 1fr 32px 1fr 32px"><span>Business documentation</span><span class="bar" style="opacity:1"><i style="width:60%;background:var(--chart-1)"></i></span><span class="v">60</span><span class="bar"><i style="width:60%"></i></span><span class="v">60</span></div>
<p class="t-caption subtle">Model cc-uw 0.4.2 · scores 0–100 · follower count is not an input.</p></section></div>
</body></html>
