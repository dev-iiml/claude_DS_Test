<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<div class="spec" style="max-width:520px">
  <div class="stack g1"><span class="t-eyebrow">Step 2 of 5 · About you</span><h2 class="t-h1">Tell us about your work</h2></div>
  <div class="alert a-danger" role="alert"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg><div><b>Two things need a look</b><a class="link" style="color:inherit">Primary platform</a> · <a class="link" style="color:inherit">City</a></div></div>
  <div class="field"><label class="label">Primary platform</label><div class="select-wrap"><select class="select" aria-invalid="true" style="border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)"><option>Choose one</option></select><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></div><p class="msg msg-error"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg>Choose where most of your work lives.</p></div>
  <div class="field"><label class="label">City</label><input class="input" aria-invalid="true"><p class="msg msg-error"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /></svg>Enter your city — we use it for local access drops.</p></div>
  <div class="field"><label class="label">Years creating professionally</label><input class="input num is-valid" value="4"></div>
  <div class="row between"><span class="t-small subtle">Saved a moment ago</span><button class="btn btn-primary">Continue</button></div>
</div>
</body></html>
