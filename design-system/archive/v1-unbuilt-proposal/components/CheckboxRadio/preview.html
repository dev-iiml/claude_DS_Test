<!-- @dsCard group="Forms" height=340 -->
<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<div class="spec"><div class="spec-row top" style="gap:40px">
  <fieldset style="border:0;padding:0;margin:0" class="stack g3"><legend class="label" style="margin-bottom:8px">Content categories</legend>
    <label class="check"><input type="checkbox" checked><span class="txt"><b>Beauty</b></span></label>
    <label class="check"><input type="checkbox" checked><span class="txt"><b>Fashion</b></span></label>
    <label class="check"><input type="checkbox"><span class="txt"><b>Food</b></span></label>
    <label class="check"><input type="checkbox" disabled><span class="txt"><b>Finance</b><span>Not open in the pilot</span></span></label>
  </fieldset>
  <fieldset style="border:0;padding:0;margin:0;width:360px" class="stack g2"><legend class="label" style="margin-bottom:8px">How do you earn?</legend>
    <label class="option is-on check"><input type="radio" name="e" checked><span class="txt"><b>Individual creator</b><span>You earn in your own name.</span></span></label>
    <label class="option check"><input type="radio" name="e"><span class="txt"><b>Sole proprietor</b><span>You run a registered proprietorship.</span></span></label>
    <label class="option check"><input type="radio" name="e" aria-invalid="true"><span class="txt"><b>LLP or company</b><span>Coming later in the pilot.</span></span></label>
  </fieldset>
</div></div>
</body></html>
