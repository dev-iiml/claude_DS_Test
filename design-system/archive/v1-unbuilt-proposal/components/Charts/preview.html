<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<style>.ax{font:400 11px var(--font-sans);fill:var(--text-subtle);font-variant-numeric:tabular-nums} .dl{font:500 12px var(--font-sans);fill:var(--text)} .tip{position:absolute;pointer-events:none;background:var(--surface-raised);border:1px solid var(--border);box-shadow:var(--shadow-2);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;opacity:0;transition:opacity .12s} .lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)} .lg i{width:10px;height:2px;border-radius:2px}</style>
<div class="spec"><div class="spec-row top" style="gap:24px">
  <section class="card card-pad stack g3" style="width:620px;position:relative" id="lc"><div class="row between"><h3 class="t-h3">Monthly earnings</h3><div class="row g3"><span class="lg"><i style="background:var(--chart-1)"></i>Brand deals</span><span class="lg"><i style="background:var(--chart-2)"></i>Platform payouts</span></div></div><svg viewBox="0 0 560 220" width="100%" role="img" aria-label="Monthly earnings by source, Nov 2025 to Oct 2026. Brand deals rose from ₹62k to ₹135k; platform payouts from ₹18k to ₹31k.">
<line x1="44" x2="464" y1="192.0" y2="192.0" stroke="var(--chart-grid)" stroke-width="1"/><text x="36" y="196.0" text-anchor="end" class="ax">₹0k</text><line x1="44" x2="464" y1="132.0" y2="132.0" stroke="var(--chart-grid)" stroke-width="1"/><text x="36" y="136.0" text-anchor="end" class="ax">₹50k</text><line x1="44" x2="464" y1="72.0" y2="72.0" stroke="var(--chart-grid)" stroke-width="1"/><text x="36" y="76.0" text-anchor="end" class="ax">₹100k</text><line x1="44" x2="464" y1="12.0" y2="12.0" stroke="var(--chart-grid)" stroke-width="1"/><text x="36" y="16.0" text-anchor="end" class="ax">₹150k</text><text x="44.0" y="212" text-anchor="middle" class="ax">Nov</text><text x="120.4" y="212" text-anchor="middle" class="ax">Jan</text><text x="196.7" y="212" text-anchor="middle" class="ax">Mar</text><text x="273.1" y="212" text-anchor="middle" class="ax">May</text><text x="349.5" y="212" text-anchor="middle" class="ax">Jul</text><text x="425.8" y="212" text-anchor="middle" class="ax">Sep</text>
<line id="xh" x1="0" x2="0" y1="12" y2="192" stroke="var(--text-subtle)" stroke-width="1" opacity="0"/>
<polyline fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="44.0,117.6 82.2,96.0 120.4,122.4 158.5,108.0 196.7,81.6 234.9,86.4 273.1,66.0 311.3,74.4 349.5,48.0 387.6,57.6 425.8,38.4 464.0,30.0"/>
<polyline fill="none" stroke="var(--chart-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="44.0,170.4 82.2,165.6 120.4,168.0 158.5,166.8 196.7,163.2 234.9,164.4 273.1,160.8 311.3,162.0 349.5,158.4 387.6,159.6 425.8,156.0 464.0,154.8"/>
<circle cx="464.0" cy="30.0" r="4" fill="var(--chart-1)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="464.0" cy="154.8" r="4" fill="var(--chart-2)" stroke="var(--surface)" stroke-width="2"/>
<text x="474.0" y="34.0" class="dl">Brand deals</text>
<text x="474.0" y="158.8" class="dl">Platform</text>
<rect class="hit" x="26.0" y="12" width="36" height="180" data-i="0" fill="transparent"/><rect class="hit" x="64.2" y="12" width="36" height="180" data-i="1" fill="transparent"/><rect class="hit" x="102.4" y="12" width="36" height="180" data-i="2" fill="transparent"/><rect class="hit" x="140.5" y="12" width="36" height="180" data-i="3" fill="transparent"/><rect class="hit" x="178.7" y="12" width="36" height="180" data-i="4" fill="transparent"/><rect class="hit" x="216.9" y="12" width="36" height="180" data-i="5" fill="transparent"/><rect class="hit" x="255.1" y="12" width="36" height="180" data-i="6" fill="transparent"/><rect class="hit" x="293.3" y="12" width="36" height="180" data-i="7" fill="transparent"/><rect class="hit" x="331.5" y="12" width="36" height="180" data-i="8" fill="transparent"/><rect class="hit" x="369.6" y="12" width="36" height="180" data-i="9" fill="transparent"/><rect class="hit" x="407.8" y="12" width="36" height="180" data-i="10" fill="transparent"/><rect class="hit" x="446.0" y="12" width="36" height="180" data-i="11" fill="transparent"/></svg><div class="tip" id="tip"></div><a class="link t-small">View as table</a></section>
  <div class="stack g4" style="width:300px">
    <section class="card card-pad stat"><span class="t-eyebrow">Last 12 months</span><span class="t-num-lg">₹14.4L</span><svg class="spark" viewBox="0 0 240 36" preserveAspectRatio="none" aria-label="Sparkline, rising"><polyline fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" points="0,28 22,24 44,30 66,26 88,18 110,20 132,14 154,16 176,9 198,12 220,7 240,5"/></svg></section>
    <section class="card card-pad stack g2"><h3 class="t-title">By source</h3><div class="stack g3" role="img" aria-label="Earnings by source, last 12 months: brand deals ₹11.5L, platform payouts ₹3.0L"><div class="stack g1"><div class="row between t-small"><span>Brand deals</span><span class="t-num">₹11.5L</span></div><div style="height:10px;border-radius:4px;background:var(--surface-sunken)"><div style="height:10px;width:100.0%;border-radius:4px;background:var(--chart-1)"></div></div></div><div class="stack g1"><div class="row between t-small"><span>Platform payouts</span><span class="t-num">₹3.0L</span></div><div style="height:10px;border-radius:4px;background:var(--surface-sunken)"><div style="height:10px;width:25.7%;border-radius:4px;background:var(--chart-1)"></div></div></div></div></section>
  </div>
</div></div>
<script>
const B=[62, 80, 58, 70, 92, 88, 105, 98, 120, 112, 128, 135],P=[18, 22, 20, 21, 24, 23, 26, 25, 28, 27, 30, 31],M=['Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];const xs=[44.0, 82.2, 120.4, 158.5, 196.7, 234.9, 273.1, 311.3, 349.5, 387.6, 425.8, 464.0];
const tip=document.getElementById('tip'),xh=document.getElementById('xh'),lc=document.getElementById('lc');
document.querySelectorAll('.hit').forEach(r=>{r.addEventListener('mouseenter',()=>{const i=+r.dataset.i;xh.setAttribute('x1',xs[i]);xh.setAttribute('x2',xs[i]);xh.setAttribute('opacity',1);tip.innerHTML='<b>'+M[i]+'</b><br>Brand deals ₹'+B[i]+'k<br>Platform ₹'+P[i]+'k';const box=r.getBoundingClientRect(),c=lc.getBoundingClientRect();tip.style.left=(box.left-c.left+24)+'px';tip.style.top='60px';tip.style.opacity=1;});r.addEventListener('mouseleave',()=>{tip.style.opacity=0;xh.setAttribute('opacity',0);});});
</script>
</body></html>
