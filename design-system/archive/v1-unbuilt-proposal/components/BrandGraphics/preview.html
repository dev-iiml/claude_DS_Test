<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<div class="spec"><div class="spec-row top" style="gap:24px">
  <div class="stack g2" style="align-items:center;color:var(--text)"><svg class="door" width="120" height="190" viewBox="0 0 120 190" aria-hidden="true"><path d="M1 189 V60.0 A59.0 59.0 0 0 1 119 60.0 V189 Z"/></svg><span class="t-caption subtle">Door · hairline</span></div>

  <div class="stack g2" style="align-items:center"><div style="width:190px;height:190px;border-radius:20px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center"><span style="width:18px;height:18px;border-radius:9999px;background:var(--accent)"></span></div><span class="t-caption subtle">Rani dot</span></div>
  <div class="stack g2" style="align-items:center"><div class="art-photo" style="width:240px;height:190px;border-radius:20px;position:relative"><span class="ph" style="position:absolute;top:12px;left:12px;font:500 10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-subtle)">Creator photo</span></div><span class="t-caption subtle">Photo placeholder</span></div>
</div></div>
